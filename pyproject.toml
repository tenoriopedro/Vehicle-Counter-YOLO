[project]
name = "vehicle_counter"
version = "0.1.0"
description = "Sistema de Detecção e Contagem de veiculos com YOLOv8"
readme = "README.md"
requires-python = "==3.11.9"
license = { text = "MIT" }
authors = [{ name = "Pedro Tenório", email = "pstsouza13@gmail.com" }]

dependencies = [
    "opencv-python",
    "ultralytics",
    "torch==2.3.1",
    "torchvision==0.18.1",
    "numpy<2.0.0",
    "shapely==2.0.0",
    "lap==0.5.12",
    "pyarrow",
    "pandas",
]

[project.optional-dependencies]
# Dependências de desenvolvimento padrão
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-xdist",

    "dvc",
]

[project.scripts]

# Compilação e Resultado
vehicle_counter = "vehicle_counter.compile_video:run"

# Build System
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_counter"]

# Ferramentas: Ruff (Linter & Formatter)
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]
fix = true
show-fixes = true
indent-width = 4
exclude = [
    "venv", ".venv", "env", ".env", "node_modules", "__pycache__"
]

[tool.ruff.lint]
# Seleção rigorosa de regras para manter o código limpo desde o dia 1
select = [
    "ASYNC", "A", "ANN", "B", "BLE", "C4", "C90", "COM", "E", "EM",
    "ERA", "EXE", "F", "FBT", "FIX", "I", "ICN", "ISC", "Q", "RET",
    "RSE", "S", "SIM", "SLF", "T10", "T20", "TC", "TD", "TRY", "UP",
    "W", "YTT", "RUF", "N"
]
ignore = ["T201", "COM812"] # T201 permite print (útil em scripts simples)

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "S101"] # Ignora tipos de retorno e asserts em testes

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
# Ensina ao Ruff qual é o pacote principal do seu projeto.
# Deve ser o mesmo nome da pasta dentro de 'src/'.
known-first-party = ["vehicle_counter"]

# Ferramentas: Pyright (Type Checker)
[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["src", "tests",]
exclude = [
    "**/venv", "**/.venv", "**/env", "**/.env",
    "**/node_modules", "**/__pycache__", "**/.*"
]
venv = ".venv"
venvPath = "."
executionEnvironments = [{ root = "src" }]

# Ferramentas: Pytest
[tool.pytest.ini_options]
addopts = "-s --color=yes --tb=short"
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "dvc>=3.67.0",
]
